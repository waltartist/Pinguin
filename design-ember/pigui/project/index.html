<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi GUI — Dark UI Directions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@1,500&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0; padding: 0;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: #f0eee9; /* design canvas paper bg */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Tighter focus + cursor sanity for all inputs in the previews */
    input, button, select { font-family: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="direction-ember.jsx"></script>
  <script type="text/babel" src="direction-amber.jsx"></script>
  <script type="text/babel" src="direction-forge.jsx"></script>

  <script type="text/babel" data-presets="react">
    const root = ReactDOM.createRoot(document.getElementById('root'));

    function App() {
      return (
        <DesignCanvas
          title="Pi GUI — Dark UI Directions"
          subtitle="Soft-modern · warm accents · IBM Plex · 3 directions to pick from"
        >
          <DCSection
            id="ember"
            title="A · Ember"
            subtitle="Coral accent · soft elevation · Raycast-clean — the quiet option"
          >
            <DCArtboard id="ember-main" label="A · Full template" width={1480} height={760}>
              <EmberArtboard />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="amber"
            title="B · Amber Glow"
            subtitle="Honey accent · radial glow · expressive agent presence — the alive option"
          >
            <DCArtboard id="amber-main" label="B · Full template" width={1480} height={760}>
              <AmberArtboard />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="forge"
            title="C · Forge"
            subtitle="Orange · mono+sans · technical density · sharp corners — the developer-tool option"
          >
            <DCArtboard id="forge-main" label="C · Full template" width={1480} height={760}>
              <ForgeArtboard />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    root.render(<App />);
  </script>
</body>
</html>
